- aid: chartmogul:webhooks
  name: ChartMogul Webhooks
  description: >-
    Outbound webhook destination for ChartMogul. ChartMogul POSTs JSON event bodies to a subscriber-configured
    HTTPS endpoint whenever a customer-level MRR movement is recorded. Only the `mrr_movement` event type
    is documented; movement_type categorizes the event as new_biz, churn, expansion, contraction, or reactivation.
  humanURL: https://dev.chartmogul.com/docs/destinations/webhooks
