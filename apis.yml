apis:
- aid: chartmogul:rest-api
  name: ChartMogul REST API
  description: >-
    REST API for ChartMogul providing endpoints for importing customers, subscriptions, plans, invoices,
    and transactions, plus reading SaaS metrics (MRR, ARR, ARPA, churn, LTV), customer attributes, segments,
    and forecasts. All requests are over HTTPS and authenticate via HTTP Basic Auth using an API key as
    the username.
  humanURL: https://dev.chartmogul.com/docs/introduction
  baseURL: https://api.chartmogul.com
